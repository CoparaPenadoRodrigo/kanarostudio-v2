<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Somos un estudio creativo en Lima que une estrategia, diseño y tecnología para construir marcas, experiencias digitales y soluciones que hacen crecer tu negocio." />
		<title>KanaroStudio | Branding, páginas web y marketing en Lima</title>
		<link rel="canonical" href="https://kanarostudio.com/" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://kanarostudio.com/" />
		<meta property="og:site_name" content="KanaroStudio" />
		<meta property="og:title" content="KanaroStudio | Branding, páginas web y marketing en Lima" />
		<meta property="og:description" content="Somos un estudio creativo en Lima que une estrategia, diseño y tecnología para construir marcas, experiencias digitales y soluciones que hacen crecer tu negocio." />
		<meta property="og:image" content="https://kanarostudio.com/kanarostudio-social.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Logo de KanaroStudio sobre un fondo claro" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://kanarostudio.com/kanarostudio-social.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "WebSite",
					"name": "KanaroStudio",
					"url": "https://kanarostudio.com/"
				},
				{
					"@type": "Organization",
					"name": "KanaroStudio",
					"url": "https://kanarostudio.com/",
					"logo": "https://kanarostudio.com/favicon.png"
				}
			]
		}
		</script>
		<style>
			#root > .initial-loader {
				min-height: 100vh;
				min-height: 100svh;
				display: grid;
				place-items: center;
				background: #fff;
			}
			.initial-loader img {
				width: 64px;
				height: 64px;
				animation: kanaro-loader-spin 1.1s linear infinite;
			}
			@keyframes kanaro-loader-spin {
				to { transform: rotate(360deg); }
			}
			@media (prefers-reduced-motion: reduce) {
				.initial-loader img { animation: none; }
			}
		</style>
	</head>
	<body>
		<div id="root"><div class="initial-loader" role="status" aria-label="Cargando KanaroStudio"><img src="/favicon.png" alt="" width="64" height="64" /></div></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
